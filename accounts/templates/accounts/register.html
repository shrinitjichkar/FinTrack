{% extends 'base.html' %}

{% block title %}Register - Finance Tracker{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card card shadow-sm p-4">
            <h3 class="text-center mb-4" >Create an Account</h3>

            <form method="POST" action="{% url 'register' %}">
                {% csrf_token %}
                {% for field in form %}
                <div class="mb-3">
                    <label for="{{ field.id_for_label }}" class="form-label text-muted"><small>{{ field.label }}</small></label>
                    {{ field }}
                    {% for error in field.errors %}
                        <div class="text-danger small mt-1">{{ error }}</div>
                    {% endfor %}
                </div>
                {% endfor %}
                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-primary btn-lg">Register</button>
                </div>
            </form>

            <div class="text-center mt-4 text-muted"><small>
                Already have an account? <a href="{% url 'login' %}" class="text-decoration-none" >Login here</a>
            </small></div>
        </div>
    </div>
</div>
{% endblock %}
