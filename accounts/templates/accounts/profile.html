{% extends 'base.html' %}

{% block title %}Profile - Finance Tracker{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow-sm p-4">
            <h3 class="text-center mb-4 text-primary">Your Profile</h3>

            <div class="text-center mb-4">
                <img src="{{ user.profile.image.url }}" class="rounded-circle img-thumbnail" style="width: 150px; height: 150px; object-fit: cover;" alt="Profile Picture">
                <h4 class="mt-3">{{ user.username }}</h4>
                <p class="text-muted">{{ user.email }}</p>
            </div>

            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label text-muted"><small>Update Profile Picture</small></label>
                    {{ p_form.image }}
                </div>
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary">Update Profile</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
